<rect x='35' y='720' width='450' height='210' rx='12' class='box'/>
<text x='55' y='755' class='title'>MAX98357A / 喇叭</text>
<text x='55' y='790' class='label'>BCLK → GPIO42；LRC → GPIO41</text>
<text x='55' y='820' class='label'>DIN → GPIO40；SD/EN → GPIO39</text>
<text x='55' y='850' class='label'>VIN → 5V_AUDIO；GND → 系统地</text>
<text x='55' y='880' class='label'>SPK+ ─ 喇叭 ─ SPK-；两端不接地</text>
<rect x='510' y='720' width='470' height='210' rx='12' class='box'/>
<text x='530' y='755' class='title'>屏幕 / 按钮 / 四路 SG90</text>
<text x='530' y='790' class='label'>屏 SCK4 / MOSI5 / RST6 / DC7 / CS15</text>
<text x='530' y='820' class='label'>屏 VCC→3V3；GND→地；ST7735 BL→16</text>
<text x='530' y='850' class='label'>按钮 GPIO2 / GPIO47 → 常开按钮 → 地</text>
<text x='530' y='880' class='label'>舵机信号 12/13/14/17；独立供电并共地</text>
<rect x='1005' y='720' width='455' height='210' rx='12' class='box'/>
<text x='1025' y='755' class='title'>步进预留 / 电源分支</text>
<text x='1025' y='790' class='label'>STEP8 / DIR9 / nSLEEP10 → DRV8834</text>
<text x='1025' y='820' class='label'>VM → 5V_MOTOR；A1/A2、B1/B2 → 两相</text>
<text x='1025' y='850' class='label'>5V_LOGIC → ESP32 VIN</text>
<text x='1025' y='880' class='label'>逻辑 / 功放 / 电机在电源入口分支</text>
<text x='35' y='977' class='label'>接点规则：同名网相连；不同颜色线交叉不代表连接。两组 BCLK、WS、SD 禁止互接。</text>
<text x='35' y='1010' class='label'>每只麦克风 VDD/GND 就近 100nF；SD_A、SD_B 预留 100kΩ 下拉；MIC2 / MIC3 可暂不装。</text>
<text x='35' y='1043' class='label'>默认仅 MIC1；/mic count 1|2|3 设置数量。支持选路录音；独立时钟不保证阵列同步，尚未实物验证。</text>
<text x='35' y='1080' class='small'>详细针表、线束走向、供电及验证步骤：同目录《接线方案.md》 · 2026-10-02</text>
</svg>
