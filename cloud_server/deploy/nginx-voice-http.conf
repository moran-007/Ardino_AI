# HTTP-only first-stage configuration for voice.bsnlch.xyz.
# Install as /etc/nginx/sites-available/voice.bsnlch.xyz.conf and enable it.
server {
    listen 80;
    listen [::]:80;
    server_name voice.bsnlch.xyz;

    # Signed OTA ZIP packages can contain an application image up to 3 MiB.
    client_max_body_size 4m;

    location /voice-api/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }

    location /admin/ {
        # 20 MiB MP3 sources plus multipart headers.
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        return 308 /admin/;
    }

    location = / {
        return 302 /admin/;
    }

    location / {
        return 404;
    }
}
